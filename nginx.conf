# Configuración de Nginx para PB Studio Backend
# Reemplaza 'tudominio.com' con tu dominio real

server {
    listen 80;
    server_name api.tudominio.com;  # Cambia esto por tu subdominio real

    # Logs
    access_log /var/log/nginx/pbstudio-api-access.log;
    error_log /var/log/nginx/pbstudio-api-error.log;

    # Tamaño máximo de archivos subidos
    client_max_body_size 50M;

    # Proxy al backend Node.js
    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        
        # Headers necesarios
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        proxy_cache_bypass $http_upgrade;
    }

    # Archivos estáticos (si los sirve el backend)
    location /uploads {
        alias /home/tu-usuario/apip-bstudio-relacional/public/uploads;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
